[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "habari-mcp"
version = "0.1.12"
description = "MCP server for Kenya civic information — Kenya Gazette, government tenders, open data, parliament tracker, citizen feedback channels. 5 tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.1.4", "pydantic>=2.5.0"]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.scripts]
habari-mcp = "habari_mcp.server:mcp.run"

[project.urls]
Issues = "https://github.com/gabrielmahia/habari-mcp/issues"
Homepage = "https://github.com/gabrielmahia/habari-mcp"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"
[tool.setuptools.packages.find]
where = ["src"]
